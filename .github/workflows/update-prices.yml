name: Update reseller prices

on:
  workflow_dispatch:
  schedule:
    # Hourly. GitHub cron is UTC and may start a few minutes late.
    - cron: '17 * * * *'
  push:
    paths:
      - 'scripts/update-prices.mjs'
      - 'package.json'
      - '.github/workflows/update-prices.yml'

concurrency:
  group: reseller-price-refresh
  cancel-in-progress: false

jobs:
  refresh-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Pull latest Champions Travel / P1 prices
        id: scrape
        run: npm run update-prices

      - name: Price refresh summary
        if: always()
        shell: bash
        env:
          SCRAPE_OUTCOME: ${{ steps.scrape.outcome }}
        run: |
          echo '## Reseller price refresh' >> "$GITHUB_STEP_SUMMARY"
          echo "Scrape step: **${SCRAPE_OUTCOME}**" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"

          if [[ -f data/prices.json ]]; then
            node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('data/prices.json','utf8'));
          const rows = Object.values(p.fixtures || {});
          const live = provider => rows.filter(r => typeof r?.[provider]?.price === 'number').length;
          const failed = provider => rows.filter(r => String(r?.[provider]?.status || '').includes('failed')).length;
          const generated = p.generatedAt ? new Date(p.generatedAt) : null;
          const ageMinutes = generated && !Number.isNaN(generated.getTime())
            ? Math.max(0, Math.round((Date.now() - generated.getTime()) / 60000))
            : null;
          console.log(`Price file timestamp: **${p.generatedAt || 'unknown'}**`);
          if (ageMinutes !== null) console.log(`\nPrice-file age at summary time: **${ageMinutes} min**`);
          console.log(`\n- Champions Travel prices: **${live('champions')}**`);
          console.log(`- P1 Travel prices: **${live('p1')}**`);
          console.log(`- CT fetch failures retained from previous good data: **${failed('champions')}**`);
          console.log(`- P1 fetch failures retained from previous good data: **${failed('p1')}**`);
          NODE
          else
            echo 'data/prices.json was not produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit updated price feed
        if: success()
        run: |
          if [[ -n "$(git status --porcelain data/prices.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/prices.json
            git commit -m "Update reseller prices"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          else
            echo "No price changes to commit"
          fi
