name: Update reseller prices

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    paths:
      - 'scripts/update-prices.mjs'
      - 'scripts/update-flights.mjs'
      - 'package.json'
      - '.github/workflows/update-prices.yml'

concurrency:
  group: trip-data-refresh
  cancel-in-progress: false

jobs:
  refresh-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Pull latest Champions Travel / P1 prices
        id: scrape
        run: npm run update-prices

      - name: Pull latest Ryanair timetables
        id: flights
        env:
          FORCE_FLIGHTS: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: npm run update-flights

      - name: Trip-data refresh summary
        if: always()
        shell: bash
        env:
          SCRAPE_OUTCOME: ${{ steps.scrape.outcome }}
          FLIGHT_OUTCOME: ${{ steps.flights.outcome }}
        run: |
          echo '## Trip data refresh' >> "$GITHUB_STEP_SUMMARY"
          echo "Reseller scrape: **${SCRAPE_OUTCOME}**" >> "$GITHUB_STEP_SUMMARY"
          echo "Ryanair timetable step: **${FLIGHT_OUTCOME}**" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f data/prices.json ]]; then
            node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('data/prices.json','utf8'));
          const rows=Object.values(p.fixtures||{});
          const quoted=x=>rows.filter(r=>typeof r?.[x]?.price==='number').length;
          const fresh=x=>rows.filter(r=>typeof r?.[x]?.price==='number' && !r[x].stale).length;
          const stale=x=>rows.filter(r=>typeof r?.[x]?.price==='number' && r[x].stale).length;
          const statuses=x=>rows.reduce((a,r)=>{const s=r?.[x]?.status||'missing';a[s]=(a[s]||0)+1;return a;},{});
          console.log(`### Reseller prices`);
          console.log(`Price file timestamp: **${p.generatedAt||'unknown'}**`);
          console.log(`\n- Champions Travel: **${quoted('champions')} quoted** (${fresh('champions')} fresh / ${stale('champions')} retained)`);
          console.log(`- P1 Travel: **${quoted('p1')} quoted** (${fresh('p1')} fresh / ${stale('p1')} retained)`);
          console.log(`- FX: USD ${p.fx?.USD??'unavailable'} · GBP ${p.fx?.GBP??'unavailable'} per EUR`);
          console.log(`\nCT statuses: \`${JSON.stringify(statuses('champions'))}\``);
          console.log(`\nP1 statuses: \`${JSON.stringify(statuses('p1'))}\``);
          NODE
          else
            echo 'data/prices.json was not produced.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f data/flights.json ]]; then
            node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs=require('fs');
          const f=JSON.parse(fs.readFileSync('data/flights.json','utf8'));
          const routes=Object.keys(f.routes||{}).length;
          const dates=Object.values(f.routes||{}).reduce((n,r)=>n+Object.keys(r||{}).length,0);
          const flights=Object.values(f.routes||{}).reduce((n,r)=>n+Object.values(r||{}).reduce((m,d)=>m+(d?.length||0),0),0);
          console.log(`### Ryanair schedules`);
          console.log(`Timetable timestamp: **${f.generatedAt||'not refreshed yet'}**`);
          console.log(`\n- Routes loaded: **${routes}**`);
          console.log(`- Flight dates loaded: **${dates}**`);
          console.log(`- Individual flights loaded: **${flights}**`);
          console.log(`- Last refresh requests: ${f.status?.successful??0} successful / ${f.status?.failed??0} failed / ${f.status?.preservedMonths??0} failed months retained`);
          if ((f.status?.failures||[]).length) console.log(`\nFailures: \`${JSON.stringify(f.status.failures)}\``);
          NODE
          fi

      - name: Commit updated trip-data feeds
        if: success()
        run: |
          if [[ -n "$(git status --porcelain data/prices.json data/flights.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/prices.json data/flights.json
            git commit -m "Update trip data"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          else
            echo "No trip-data changes to commit"
          fi
