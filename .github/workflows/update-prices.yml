name: Update reseller prices

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    paths:
      - 'scripts/update-prices.mjs'
      - 'package.json'
      - '.github/workflows/update-prices.yml'

concurrency:
  group: reseller-price-refresh
  cancel-in-progress: false

jobs:
  refresh-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Pull latest Champions Travel / P1 prices
        id: scrape
        run: npm run update-prices

      - name: Price refresh summary
        if: always()
        shell: bash
        env:
          SCRAPE_OUTCOME: ${{ steps.scrape.outcome }}
        run: |
          echo '## Reseller price refresh' >> "$GITHUB_STEP_SUMMARY"
          echo "Scrape step: **${SCRAPE_OUTCOME}**" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f data/prices.json ]]; then
            node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('data/prices.json','utf8'));
          const rows=Object.values(p.fixtures||{});
          const quoted=x=>rows.filter(r=>typeof r?.[x]?.price==='number').length;
          const fresh=x=>rows.filter(r=>typeof r?.[x]?.price==='number' && !r[x].stale).length;
          const stale=x=>rows.filter(r=>typeof r?.[x]?.price==='number' && r[x].stale).length;
          const statuses=x=>rows.reduce((a,r)=>{const s=r?.[x]?.status||'missing';a[s]=(a[s]||0)+1;return a;},{});
          console.log(`Price file timestamp: **${p.generatedAt||'unknown'}**`);
          console.log(`\n- Champions Travel: **${quoted('champions')} quoted** (${fresh('champions')} fresh / ${stale('champions')} retained)`);
          console.log(`- P1 Travel: **${quoted('p1')} quoted** (${fresh('p1')} fresh / ${stale('p1')} retained)`);
          console.log(`- FX: USD ${p.fx?.USD??'unavailable'} · GBP ${p.fx?.GBP??'unavailable'} per EUR`);
          console.log(`\n### CT scrape statuses\n\`${JSON.stringify(statuses('champions'))}\``);
          console.log(`\n### P1 scrape statuses\n\`${JSON.stringify(statuses('p1'))}\``);
          NODE
          else
            echo 'data/prices.json was not produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit updated price feed
        if: success()
        run: |
          if [[ -n "$(git status --porcelain data/prices.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/prices.json
            git commit -m "Update reseller prices"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          else
            echo "No price changes to commit"
          fi
